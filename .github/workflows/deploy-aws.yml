name: Deploy backend to AWS (optional)

# Manual CI/CD from GitHub to AWS using short-lived OIDC credentials - no access keys stored in GitHub.
# One-time setup (in the AWS account, by its owner):
#   1. Create the role:  aws cloudformation deploy --template-file infra/github-oidc-role.yaml \
#        --stack-name smart-campus-github-deployer --capabilities CAPABILITY_NAMED_IAM
#   2. Add repository variables: AWS_DEPLOY_ROLE_ARN (stack output RoleArn) and AWS_REGION (e.g. ap-south-1)
# Then run this workflow from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Re-seed 14 days of simulated history
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before deploying
        run: pip install -r requirements-dev.txt && pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Deploy
        env:
          BACKFILL: ${{ inputs.backfill && '1' || '0' }}
        run: bash deploy.sh
